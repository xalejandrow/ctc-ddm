services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: sigma, POSTGRES_USER: sigma, POSTGRES_PASSWORD: sigma }
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigma -d sigma"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment: { DATABASE_URL: postgresql://sigma:sigma@db:5432/sigma }
    ports: ["3001:3001"]
    depends_on:
      db:
        condition: service_healthy
